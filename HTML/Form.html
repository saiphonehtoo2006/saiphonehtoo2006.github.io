<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="get">
        <label for="name">Name</label>
        <input type="text" name="stuName" id="name" placeholder="Enter Your Name">
        <br><br>
        <label for="email">Email</label>
        <input type="email" name="stuEmail" id="email" placeholder="@gmail.com">
        <br><br>
        <label for="password">Password</label>
        <input type="password" name="stuPassword" id="password">
        <br><br>
        <label for="phone">Phone</label>
        <input type="number" name="stuPhone" id="phone">
        <br><br>
        <label for="dob">Date of Birth</label>
        <input type="date" name="stuDOB" id="dob">
        <br><br>
        <label for="passport">Passport</label>
        <input type="file" name="stupassport" id="passport">
        <br><br>
        <label for="year">Year</label>
        <select name="stuYear" id="year">
            <option value="">Choose Year</option>
            <option value="1">Frist Year</option>
            <option value="2">Second Year</option>
            <option value="3">Third Year</option>
        </select>
        <br><br>
        <label for="">Gander</label>
        <br>
        <input type="radio" name="gander" id="male" value="Male"> <label for="male">Male</label>
        <input type="radio" name="gander" id="female" value="Female"> <label for="female">Female</label>
        <br><br>
        <label for="hobby">Hobby</label>
        <br>
        <input type="checkbox" name="travelling" id="travelling" value="Travelling"><label for="travelling">Traveliing</label>
        <input type="checkbox" name="reading" id="reading" value="Reading"><label for="reading">Reading</label>
         <input type="checkbox" name="gamming" id="gamming" value="Gamming"><label for="gamming">Gamming</label>
         <br><br>
         <label for="address">Address</label>
         <textarea name="stuAddress" id="address"></textarea>
         <br>
         <input type="color">
         <input type="time">
         <input type="range">
         <br>
        <label for="">City</label>
        <select name="select" id="">
            <option value="">Choose City</option>
            <option value="1">Yangon</option>
            <option value="2">Mandalay</option>
            <option value="3">Naypyaitaw</option>
        </select>
        <br>
        <button type="submit">Save</button>
    </form>
</body>
</html>
