<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="color:blue;">Shopping List</h1>
    <table border="1" cellspacing="0" cellpadding="25">
        <thead>
            <tr>
            <th>No.</th>
            <th>Item</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Amount</th>
            </tr>
        </thead>
       <tbody>
        <tr>
            <td>I</td>
            <td>Apple</td>
            <td>5000MMk</td>
            <td>3</td>
            <td>15000MMK</td>
        </tr>
        <tr>
            <td>II</td>
            <td>Orange</td>
            <td>4000MMK</td>
            <td>5</td>
            <td>20000MMK</td>
        </tr>
        <tr>
            <td>III</td>
            <td>BlueBarry</td>
            <td>3000MMK</td>
            <td>3</td>
            <td>9000MMK</td>
        </tr>
       </tbody>
       <tfooter>
        <tr>
            <td colspan="4" align="right">Total</td>
            <td>44000MMK</td>
        </tr>
       </tfooter>
    </table>

    <h1>Save Money</h1>
    <table border="1" cellspacing="0" cellpadding="25">
        <thead>
            <tr>
                <td>Months</td>
                <td>Save Money</td>
                <td>Total</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>January</td>
                <td>15000MMk</td>
                <td rowspan="3">300000MMk</td>
            </tr>
            <tr>
                <td>February</td>
                <td>50000MMk</td>
            </tr>
            <tr>
                <td>March</td>
                <td>10000MMk</td>
            </tr>
        </tbody>

    </table>
</body>
</html>
